---
# ============================================================
# Ansible Playbook - AutoParts Portal Deployment
# Idempotent: safe to run multiple times
# ============================================================

- name: Deploy AutoParts Portal
  hosts: autoparts_servers
  become: yes
  gather_facts: yes
  vars_files:
    - roles/autoparts/vars/main.yml

  pre_tasks:
    - name: Print deployment info
      debug:
        msg: |
          Deploying {{ app_name }} v{{ app_version }}
          Target: {{ inventory_hostname }}
          Docker Image: {{ docker_image }}:{{ docker_tag }}

  roles:
    - autoparts

  post_tasks:
    - name: Verify application health
      uri:
        url: "http://localhost:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        timeout: 30
      register: health_check
      retries: 10
      delay: 10
      until: health_check.status == 200

    - name: Display health status
      debug:
        msg: "✅ AutoParts Portal is healthy: {{ health_check.json.status }}"
