---
# ============================================================
# Ansible Inventory - AutoParts Portal
# ============================================================

[autoparts_servers]
# Local deployment (change to remote IP for production)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[autoparts_servers:vars]
# Application settings
app_name=autoparts-portal
app_version=1.0.0
app_port=8080

# Docker settings
docker_image=autoparts/autoparts-portal
docker_tag=latest
docker_network=autoparts-network

# Database settings
db_name=autoparts
db_user=postgres
db_port=5432

# Backup settings
backup_dir=/opt/autoparts/backups
previous_tag=stable
