version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoparts-postgres
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoparts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  autoparts-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoparts-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/autoparts
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
