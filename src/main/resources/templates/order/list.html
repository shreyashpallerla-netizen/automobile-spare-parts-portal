<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - AutoParts Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/products}"><i class="bi bi-grid me-1"></i>Products</a>
            <a class="nav-link active" th:href="@{/orders}"><i class="bi bi-bag me-1"></i>Orders</a>
            <a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Cart</a>
            <a class="nav-link" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>
</nav>
<main class="container my-4">
    <h2 class="mb-4"><i class="bi bi-bag me-2 text-warning"></i>My Orders</h2>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${!orders.isEmpty()}" class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Order #</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="align-middle"><strong th:text="'#' + ${order.id}"></strong></td>
                        <td class="align-middle" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></td>
                        <td class="align-middle" th:text="${#lists.size(order.items)} + ' item(s)'"></td>
                        <td class="align-middle fw-bold text-success"
                            th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,2)}"></td>
                        <td class="align-middle">
                            <span th:class="${'badge ' + (order.status.name() == 'DELIVERED' ? 'bg-success' :
                                             order.status.name() == 'CANCELLED' ? 'bg-danger' :
                                             order.status.name() == 'SHIPPED' ? 'bg-info' :
                                             order.status.name() == 'CONFIRMED' ? 'bg-primary' : 'bg-warning text-dark')}"
                                  th:text="${order.status}"></span>
                        </td>
                        <td class="align-middle">
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-dark btn-sm">
                                <i class="bi bi-eye me-1"></i>View
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${orders.isEmpty()}" class="text-center py-5">
        <i class="bi bi-bag-x display-1 text-muted"></i>
        <h4 class="mt-3 text-muted">No orders yet</h4>
        <a th:href="@{/products}" class="btn btn-dark mt-2"><i class="bi bi-grid me-2"></i>Start Shopping</a>
    </div>
</main>
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center"><p class="mb-0"><i class="bi bi-gear-wide-connected me-1 text-warning"></i><strong>AutoParts Portal</strong> &copy; 2026</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
