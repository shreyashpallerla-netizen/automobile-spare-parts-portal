<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Order #' + ${order.id} + ' - AutoParts Portal'">Order Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/orders}"><i class="bi bi-arrow-left me-1"></i>Back to Orders</a>
            <a class="nav-link" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>
</nav>
<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-receipt me-2"></i>Order #<span th:text="${order.id}"></span></h4>
                    <span th:class="${'badge fs-6 ' + (order.status.name() == 'DELIVERED' ? 'bg-success' : order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}"
                          th:text="${order.status}"></span>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-6">
                            <p><strong>Order Date:</strong>
                                <span th:text="${#temporals.format(order.createdAt,'dd MMM yyyy HH:mm')}"></span></p>
                            <p><strong>Customer:</strong> <span th:text="${order.user.fullName}"></span></p>
                        </div>
                        <div class="col-sm-6">
                            <p><strong>Shipping Address:</strong></p>
                            <p class="text-muted" th:text="${order.shippingAddress}"></p>
                        </div>
                    </div>
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr><th>Product</th><th class="text-center">Qty</th><th class="text-center">Unit Price</th><th class="text-end">Subtotal</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.items}">
                                <td class="align-middle">
                                    <div class="d-flex align-items-center">
                                        <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isBlank()}"
                                             th:src="${item.product.imageUrl}" class="me-2 rounded bg-light border p-1" style="width:36px; height:36px; object-fit:contain;" alt="Product">
                                        <span th:text="${item.product.name}"></span>
                                    </div>
                                </td>
                                <td class="text-center align-middle" th:text="${item.quantity}"></td>
                                <td class="text-center align-middle" th:text="'₹' + ${#numbers.formatDecimal(item.unitPrice,1,2)}"></td>
                                <td class="text-end align-middle" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,2)}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-dark">
                                <td colspan="3" class="text-end fw-bold">Total:</td>
                                <td class="text-end fw-bold text-warning" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,2)}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
