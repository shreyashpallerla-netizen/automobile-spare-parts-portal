<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - AutoParts Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Cart</a>
            <a class="nav-link" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>
</nav>
<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"><i class="bi bi-credit-card me-2"></i>Checkout</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/orders/place}" th:object="${orderRequest}" method="post" novalidate>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Shipping Address</label>
                            <textarea class="form-control" th:field="*{shippingAddress}" rows="4"
                                      th:classappend="${#fields.hasErrors('shippingAddress')} ? 'is-invalid'"
                                      placeholder="Enter your complete shipping address..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('shippingAddress')}"
                                 th:errors="*{shippingAddress}"></div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Place Order
                            </button>
                            <a th:href="@{/cart}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Back to Cart
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
