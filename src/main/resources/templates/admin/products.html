<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2 text-warning"></i>Admin Panel</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/products}">Store</a>
            <a class="nav-link" th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-light sidebar py-3 min-vh-100">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/products}"><i class="bi bi-box-seam me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}"><i class="bi bi-bag me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Users</a></li>
            </ul>
        </nav>
        <main class="col-md-10 py-4 px-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-box-seam me-2 text-warning"></i>Product Management</h2>
                <a th:href="@{/admin/products/new}" class="btn btn-warning">
                    <i class="bi bi-plus-circle me-1"></i>Add New Product
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th><th>Name</th><th>SKU</th><th>Category</th>
                                <th class="text-center">Price</th><th class="text-center">Stock</th>
                                <th class="text-center">Status</th><th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products.content}">
                                <td class="align-middle" th:text="${product.id}"></td>
                                <td class="align-middle"><strong th:text="${product.name}"></strong></td>
                                <td class="align-middle"><code th:text="${product.sku}"></code></td>
                                <td class="align-middle"><span class="badge bg-secondary" th:text="${product.category}"></span></td>
                                <td class="align-middle text-center" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,2)}"></td>
                                <td class="align-middle text-center">
                                    <span th:class="${product.stockQuantity > 5} ? 'badge bg-success' : (${product.stockQuantity > 0} ? 'badge bg-warning text-dark' : 'badge bg-danger')"
                                          th:text="${product.stockQuantity}"></span>
                                </td>
                                <td class="align-middle text-center">
                                    <span th:class="${product.active} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${product.active} ? 'Active' : 'Inactive'"></span>
                                </td>
                                <td class="align-middle text-center">
                                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Deactivate this product?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
