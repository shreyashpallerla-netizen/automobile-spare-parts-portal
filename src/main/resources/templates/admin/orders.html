<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2 text-warning"></i>Admin Panel</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/products}">Store</a>
            <a class="nav-link" th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-light sidebar py-3 min-vh-100">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}"><i class="bi bi-box-seam me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/orders}"><i class="bi bi-bag me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Users</a></li>
            </ul>
        </nav>
        <main class="col-md-10 py-4 px-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <h2 class="mb-4"><i class="bi bi-bag me-2 text-warning"></i>Order Management</h2>
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr><th>Order #</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Update Status</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="align-middle">
                                    <a th:href="@{/orders/{id}(id=${order.id})}" th:text="'#' + ${order.id}"></a>
                                </td>
                                <td class="align-middle" th:text="${order.user.fullName}"></td>
                                <td class="align-middle" th:text="${#temporals.format(order.createdAt,'dd MMM yyyy')}"></td>
                                <td class="align-middle" th:text="${#lists.size(order.items)}"></td>
                                <td class="align-middle fw-bold" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,2)}"></td>
                                <td class="align-middle">
                                    <span th:class="${'badge ' + (order.status.name() == 'DELIVERED' ? 'bg-success' : order.status.name() == 'CANCELLED' ? 'bg-danger' : order.status.name() == 'SHIPPED' ? 'bg-info' : 'bg-warning text-dark')}"
                                          th:text="${order.status}"></span>
                                </td>
                                <td class="align-middle">
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex gap-1">
                                        <select name="status" class="form-select form-select-sm" style="width:130px;">
                                            <option th:each="s : ${T(com.autoparts.entity.Order.OrderStatus).values()}"
                                                    th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
