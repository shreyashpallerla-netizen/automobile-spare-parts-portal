<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2 text-warning"></i>Admin Panel</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/products}">Store</a>
            <a class="nav-link" th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-light sidebar py-3 min-vh-100">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/products}"><i class="bi bi-box-seam me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}"><i class="bi bi-bag me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Users</a></li>
            </ul>
        </nav>
        <main class="col-md-10 py-4 px-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <h2 class="mb-4"><i class="bi bi-people me-2 text-warning"></i>User Management</h2>
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Username</th><th>Full Name</th><th>Email</th><th>Roles</th><th class="text-center">Status</th><th class="text-center">Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="align-middle" th:text="${user.id}"></td>
                                <td class="align-middle"><strong th:text="${user.username}"></strong></td>
                                <td class="align-middle" th:text="${user.fullName}"></td>
                                <td class="align-middle" th:text="${user.email}"></td>
                                <td class="align-middle">
                                    <span th:each="role : ${user.roles}"
                                          th:class="${role.name.name() == 'ROLE_ADMIN'} ? 'badge bg-danger me-1' : 'badge bg-secondary me-1'"
                                          th:text="${role.name.name().replace('ROLE_', '')}"></span>
                                </td>
                                <td class="align-middle text-center">
                                    <span th:class="${user.enabled} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${user.enabled} ? 'Active' : 'Disabled'"></span>
                                </td>
                                <td class="align-middle text-center">
                                    <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" style="display:inline;">
                                        <button type="submit" th:class="${user.enabled} ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'"
                                                th:text="${user.enabled} ? 'Disable' : 'Enable'"></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
