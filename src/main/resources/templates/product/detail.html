<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - AutoParts Portal'">Product - AutoParts Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Cart</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a></li>
                <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" th:href="@{/auth/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/products}">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm text-center p-4" style="min-height:300px;">
                <img th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                     th:src="${product.imageUrl}" class="img-fluid" style="max-height:280px;" alt="Product">
                <i th:unless="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                   class="bi bi-gear text-muted my-auto" style="font-size:6rem;"></i>
            </div>
        </div>
        <div class="col-md-7">
            <span class="badge bg-secondary mb-2" th:text="${product.category}"></span>
            <h2 class="fw-bold" th:text="${product.name}">Product Name</h2>
            <p class="text-muted" th:if="${product.brand}">Brand: <strong th:text="${product.brand}"></strong></p>
            <p class="text-muted">SKU: <code th:text="${product.sku}"></code></p>
            <p class="fs-4 fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,2)}">₹0.00</p>
            <span th:class="${product.stockQuantity > 0} ? 'badge bg-success fs-6' : 'badge bg-danger fs-6'"
                  th:text="${product.stockQuantity > 0} ? 'In Stock: ' + ${product.stockQuantity} + ' units' : 'Out of Stock'"></span>

            <hr>
            <h5>Description</h5>
            <p class="text-muted" th:text="${product.description}">Description here</p>

            <div class="mt-3" sec:authorize="isAuthenticated()">
                <form th:if="${product.stockQuantity > 0}" th:action="@{/cart/add}" method="post" class="d-flex gap-2 align-items-center">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <label class="fw-semibold me-2">Qty:</label>
                    <input type="number" name="quantity" value="1" min="1"
                           th:max="${product.stockQuantity}" class="form-control" style="width:80px;">
                    <button type="submit" class="btn btn-warning btn-lg">
                        <i class="bi bi-cart-plus me-2"></i>Add to Cart
                    </button>
                </form>
                <div th:unless="${product.stockQuantity > 0}" class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle me-2"></i>This item is currently out of stock.
                </div>
            </div>
            <div class="mt-3" sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="btn btn-dark">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Add to Cart
                </a>
            </div>

            <a th:href="@{/products}" class="btn btn-outline-secondary mt-3">
                <i class="bi bi-arrow-left me-1"></i>Back to Catalogue
            </a>
        </div>
    </div>
</main>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0"><i class="bi bi-gear-wide-connected me-1 text-warning"></i><strong>AutoParts Portal</strong> &copy; 2026</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
