<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoParts Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg" style="width: 420px;">
        <div class="card-header bg-dark text-white text-center py-4">
            <h3 class="mb-0"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</h3>
            <p class="mb-0 text-muted small">Sign in to your account</p>
        </div>
        <div class="card-body p-4">
            <div th:if="${errorMsg}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
            </div>
            <div th:if="${logoutMsg}" class="alert alert-success">
                <i class="bi bi-check-circle me-2"></i><span th:text="${logoutMsg}"></span>
            </div>
            <div th:if="${successMsg}" class="alert alert-success">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
            </div>

            <form th:action="@{/auth/login}" method="post" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-dark btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </div>
            </form>

            <hr>
            <div class="text-center">
                <p class="mb-1 text-muted small">Demo Credentials:</p>
                <code class="small">admin / Admin@123</code> (Admin) |
                <code class="small">user1 / User@123</code> (User)
            </div>
        </div>
        <div class="card-footer text-center py-3">
            <span class="text-muted small">Don't have an account? </span>
            <a th:href="@{/auth/register}" class="fw-semibold">Register here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
});
</script>
</body>
</html>
