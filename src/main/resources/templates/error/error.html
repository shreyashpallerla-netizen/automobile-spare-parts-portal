<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' Error - AutoParts Portal'">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center py-5">
    <i class="bi bi-exclamation-triangle-fill display-1 text-danger mb-4"></i>
    <h1 class="display-4 fw-bold" th:text="${error ?: 'Error'}">Error</h1>
    <p class="lead text-muted" th:text="${message ?: 'Something went wrong.'}">Something went wrong.</p>
    <div class="mt-4 d-flex gap-2 justify-content-center">
        <a href="/products" class="btn btn-dark"><i class="bi bi-house me-1"></i>Go Home</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
