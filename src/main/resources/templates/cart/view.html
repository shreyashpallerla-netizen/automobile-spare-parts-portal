<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - AutoParts Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}"><i class="bi bi-gear-wide-connected me-2 text-warning"></i>AutoParts Portal</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" th:href="@{/products}"><i class="bi bi-grid me-1"></i>Products</a>
            <a class="nav-link" th:href="@{/orders}"><i class="bi bi-bag me-1"></i>Orders</a>
            <a class="nav-link active" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Cart</a>
            <a class="nav-link" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <h2 class="mb-4"><i class="bi bi-cart3 me-2 text-warning"></i>Shopping Cart</h2>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${!cartItems.isEmpty()}" class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Product</th>
                                <th class="text-center">Unit Price</th>
                                <th class="text-center">Quantity</th>
                                <th class="text-center">Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isBlank()}"
                                             th:src="${item.product.imageUrl}" class="me-3 rounded bg-light border p-1" style="width:48px; height:48px; object-fit:contain;" alt="Product">
                                        <i th:unless="${item.product.imageUrl != null and !item.product.imageUrl.isBlank()}"
                                           class="bi bi-gear me-3 text-warning fs-4"></i>
                                        <div>
                                            <strong th:text="${item.product.name}"></strong>
                                            <br><small class="text-muted" th:text="${item.product.sku}"></small>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center align-middle" th:text="'₹' + ${#numbers.formatDecimal(item.product.price,1,2)}"></td>
                                <td class="text-center align-middle">
                                    <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="d-flex justify-content-center">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                                               th:max="${item.product.stockQuantity}" class="form-control form-control-sm"
                                               style="width:70px;" onchange="this.form.submit()">
                                    </form>
                                </td>
                                <td class="text-center align-middle fw-bold text-success"
                                    th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,2)}"></td>
                                <td class="text-center align-middle">
                                    <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white"><h5 class="mb-0">Order Summary</h5></div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-3 fs-5">
                        <span>Total:</span>
                        <strong class="text-success" th:text="'₹' + ${#numbers.formatDecimal(cartTotal,1,2)}"></strong>
                    </div>
                    <div class="d-grid gap-2">
                        <a th:href="@{/orders/checkout}" class="btn btn-warning btn-lg">
                            <i class="bi bi-credit-card me-2"></i>Proceed to Checkout
                        </a>
                        <a th:href="@{/products}" class="btn btn-outline-dark">
                            <i class="bi bi-arrow-left me-1"></i>Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${cartItems.isEmpty()}" class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <h4 class="mt-3 text-muted">Your cart is empty</h4>
        <a th:href="@{/products}" class="btn btn-dark mt-2">
            <i class="bi bi-grid me-2"></i>Browse Products
        </a>
    </div>
</main>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0"><i class="bi bi-gear-wide-connected me-1 text-warning"></i><strong>AutoParts Portal</strong> &copy; 2026</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
