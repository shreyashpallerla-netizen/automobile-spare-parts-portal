<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#80deea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00acc1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>

  <!-- Quartz Glass Envelope -->
  <rect x="130" y="65" width="40" height="85" rx="20" fill="url(#glass)" stroke="#80deea" stroke-width="2"/>
  <!-- Blue xenon top cap -->
  <path d="M 130 85 C 130 65, 170 65, 170 85 Z" fill="#0288d1"/>
  <!-- Filaments -->
  <line x1="145" y1="95" x2="145" y2="135" stroke="#ffb300" stroke-width="2"/>
  <line x1="155" y1="105" x2="155" y2="135" stroke="#ffb300" stroke-width="2"/>
  <!-- Tiny coil -->
  <path d="M 143 110 Q 145 106 147 110 T 151 110" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Metal Mounting Collar Plate -->
  <circle cx="150" cy="165" r="35" fill="#cfd8dc" stroke="#78909c" stroke-width="3"/>
  <rect x="110" y="160" width="10" height="10" fill="#78909c"/>
  <rect x="180" y="160" width="10" height="10" fill="#78909c"/>

  <!-- Base Connector Pins -->
  <rect x="138" y="185" width="24" height="25" fill="#37474f"/>
  <rect x="142" y="210" width="5" height="16" fill="#ffb300"/>
  <rect x="153" y="210" width="5" height="16" fill="#ffb300"/>

  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">HEADLIGHT BULB</text>
</svg>