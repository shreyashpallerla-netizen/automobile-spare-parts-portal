<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>
  
  <g transform="translate(150, 150) rotate(-45) translate(-150, -150)">
    <!-- Terminal Nut -->
    <rect x="142" y="30" width="16" height="20" rx="3" fill="url(#metal)"/>
    <!-- Ceramic Insulator with Ribs -->
    <rect x="138" y="50" width="24" height="65" rx="4" fill="url(#ceramic)"/>
    <rect x="135" y="60" width="30" height="5" rx="2" fill="#0277bd"/>
    <rect x="135" y="72" width="30" height="5" rx="2" fill="#0277bd"/>
    <rect x="135" y="84" width="30" height="5" rx="2" fill="#0277bd"/>
    <!-- Hex Nut Body -->
    <polygon points="130,115 170,115 175,145 125,145" fill="url(#metal)"/>
    <!-- Threaded Shell -->
    <rect x="134" y="145" width="32" height="65" fill="url(#metal)"/>
    <!-- Thread ridges -->
    <line x1="134" y1="155" x2="166" y2="155" stroke="#37474f" stroke-width="3"/>
    <line x1="134" y1="167" x2="166" y2="167" stroke="#37474f" stroke-width="3"/>
    <line x1="134" y1="179" x2="166" y2="179" stroke="#37474f" stroke-width="3"/>
    <line x1="134" y1="191" x2="166" y2="191" stroke="#37474f" stroke-width="3"/>
    <line x1="134" y1="203" x2="166" y2="203" stroke="#37474f" stroke-width="3"/>
    <!-- Center Electrode -->
    <rect x="147" y="210" width="6" height="22" fill="#eceff1"/>
    <!-- Ground Electrode -->
    <path d="M 134 210 L 134 238 L 152 238" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
    <!-- Electric Spark -->
    <circle cx="150" cy="235" r="14" fill="url(#spark)" filter="url(#glow)"/>
    <polygon points="150,227 152,233 158,235 152,237 150,243 148,237 142,235 148,233" fill="#ffffff" filter="url(#glow)"/>
  </g>
  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">SPARK PLUG</text>
</svg>