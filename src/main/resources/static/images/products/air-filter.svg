<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="pleats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>
  
  <!-- Outer Rubber Frame -->
  <rect x="55" y="75" width="190" height="150" rx="14" fill="url(#frame)" stroke="#e53935" stroke-width="4"/>
  <!-- Inner Filter Bed -->
  <rect x="75" y="95" width="150" height="110" rx="6" fill="url(#pleats)"/>
  <!-- Pleat Accordion Shadows -->
  <g stroke="#d4a31e" stroke-width="2">
    <line x1="88" y1="95" x2="88" y2="205"/>
    <line x1="100" y1="95" x2="100" y2="205"/>
    <line x1="112" y1="95" x2="112" y2="205"/>
    <line x1="124" y1="95" x2="124" y2="205"/>
    <line x1="136" y1="95" x2="136" y2="205"/>
    <line x1="148" y1="95" x2="148" y2="205"/>
    <line x1="160" y1="95" x2="160" y2="205"/>
    <line x1="172" y1="95" x2="172" y2="205"/>
    <line x1="184" y1="95" x2="184" y2="205"/>
    <line x1="196" y1="95" x2="196" y2="205"/>
    <line x1="208" y1="95" x2="208" y2="205"/>
  </g>
  <!-- Reinforcement Mesh Diagonals -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.4">
    <line x1="75" y1="95" x2="225" y2="205"/>
    <line x1="75" y1="205" x2="225" y2="95"/>
    <line x1="115" y1="95" x2="225" y2="170"/>
    <line x1="75" y1="135" x2="185" y2="205"/>
    <line x1="75" y1="165" x2="185" y2="95"/>
    <line x1="115" y1="205" x2="225" y2="130"/>
  </g>
  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">AIR FILTER</text>
</svg>