<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>

  <!-- Water Cleared Arc -->
  <path d="M 60 210 A 130 130 0 0 1 240 210" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>

  <!-- Curved Wiper Beam -->
  <path d="M 50 185 Q 150 110 250 185" fill="none" stroke="url(#blade)" stroke-width="12" stroke-linecap="round"/>
  <!-- Rubber Squeegee Lip -->
  <path d="M 52 191 Q 150 116 248 191" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  <!-- Aerodynamic Spoiler Highlight -->
  <path d="M 65 180 Q 150 108 235 180" fill="none" stroke="#78909c" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Adapter Clip -->
  <rect x="135" y="132" width="30" height="18" rx="4" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <circle cx="150" cy="141" r="3" fill="#ffffff"/>

  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">WIPER BLADE</text>
</svg>