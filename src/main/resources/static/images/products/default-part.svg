<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>

  <!-- Gear -->
  <g fill="#455a64" stroke="#90a4ae" stroke-width="2">
    <circle cx="150" cy="150" r="50"/>
  </g>
  <circle cx="150" cy="150" r="25" fill="#1a1e24"/>

  <!-- Crossed Wrench Icon -->
  <g transform="translate(150, 150) rotate(45) translate(-150, -150)">
    <rect x="144" y="80" width="12" height="140" rx="4" fill="#ffb300"/>
    <circle cx="150" cy="85" r="16" fill="#ffb300"/>
    <circle cx="150" cy="85" r="9" fill="#1a1e24"/>
  </g>

  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">AUTO SPARE PART</text>
