<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="30%" stop-color="#546e7a"/>
      <stop offset="70%" stop-color="#455a64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="#1a1e24"/>
  <circle cx="150" cy="150" r="115" fill="#222730" stroke="#2c323d" stroke-width="2"/>

  <!-- Bottle Body -->
  <path d="M 125 70 L 140 70 L 140 85 L 185 105 L 195 230 L 105 230 L 115 105 L 125 85 Z" fill="url(#bottle)" stroke="#263238" stroke-width="3"/>
  <!-- Bottle Cap -->
  <rect x="120" y="55" width="25" height="18" rx="3" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <line x1="124" y1="58" x2="124" y2="69" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="128" y1="58" x2="128" y2="69" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="132" y1="58" x2="132" y2="69" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="136" y1="58" x2="136" y2="69" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="140" y1="58" x2="140" y2="69" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Ergonomic Handle Slot -->
  <path d="M 118 120 C 122 135, 122 175, 118 190" fill="none" stroke="#212529" stroke-width="6" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="130" y="118" width="56" height="85" rx="5" fill="#ffffff"/>
  <rect x="130" y="118" width="56" height="20" rx="3" fill="#0277bd"/>
  <text x="158" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">SYNTHETIC</text>
  <text x="158" y="156" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#212529" text-anchor="middle">5W-30</text>
  <!-- Golden Drop on Label -->
  <path d="M 158 165 C 158 165, 149 178, 149 184 A 9 9 0 0 0 167 184 C 167 178, 158 165, 158 165 Z" fill="url(#gold)"/>

  <text x="150" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#90a4ae" text-anchor="middle" letter-spacing="2">ENGINE OIL</text>
</svg>